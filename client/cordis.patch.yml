# dsh-cae-agent-sidebar bundle patch: adds the Abaqus workflow sidebar tab.
#
# It only contributes UI through the dsh-better-sidebar service; when that
# plugin is absent the plugin loads and is a no-op (graceful degradation).
# Install into a profile with:
#   cd dsh-cae-agent/client && dsh plugin --profile <name> add .
# (and keep dsh-better-sidebar installed + mounted in the same profile)

- insert:
    - id: dsh-cae-agent-sidebar
      name: 'dsh-cae-agent-sidebar'
